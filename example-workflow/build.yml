# Example only — copy this to .github/workflows/build.yml in your GITHUB_REPO
# if you don't already have a build workflow. It builds whatever Android
# project was pushed to the triggering branch and uploads the debug APK.
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_id }}
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
