<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0b10">
<title>APK Builder</title>
<style>
  :root {
    --bg: #0a0b10;
    --glass: rgba(255,255,255,0.06);
    --glass-strong: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.14);
    --accent: #7c93ff;
    --accent-2: #b06dff;
    --text: #f2f3f8;
    --muted: #9198ad;
    --ok: #34e0a1;
    --err: #ff6b76;
    --step-off: rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    position: fixed;
    inset: 0;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* soft floating color blobs behind the glass, like a native control-center look */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  .blob.b1 { width: 260px; height: 260px; background: var(--accent); top: -60px; left: -60px; }
  .blob.b2 { width: 300px; height: 300px; background: var(--accent-2); bottom: 10%; right: -80px; }
  .blob.b3 { width: 220px; height: 220px; background: #3ddc97; bottom: -80px; left: 20%; opacity: 0.2; }

  /* ---- top bar ---- */
  .topbar {
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
    background: rgba(15,16,24,0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
  }
  .topbar .logo {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 14px -4px rgba(124,147,255,0.6);
  }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .topbar .live {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted);
    padding: 5px 10px;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
  }
  .topbar .live .pip {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 6px var(--ok);
  }

  /* ---- scroll area ---- */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    z-index: 2;
    padding: 20px 18px calc(env(safe-area-inset-bottom, 0px) + 120px);
  }
  .subtitle { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 2px 0 20px; }

  .panel {
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 10px 40px -18px rgba(0,0,0,0.6);
  }
  .panel + .panel { margin-top: 14px; }

  #dropzone {
    border: 1.5px dashed rgba(255,255,255,0.22);
    border-radius: 16px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
    background: rgba(255,255,255,0.03);
  }
  #dropzone:active { transform: scale(0.985); }
  #dropzone.drag { border-color: var(--accent); background: rgba(124,147,255,0.12); }
  #dropzone .icon { width: 38px; height: 38px; margin: 0 auto 12px; color: var(--muted); }
  #dropzone.drag .icon, #dropzone.has-file .icon { color: var(--accent); }
  #dropzone .primary { font-size: 14.5px; font-weight: 550; }
  #dropzone .secondary { font-size: 12px; color: var(--muted); margin-top: 4px; }

  #fileRow {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 11px 13px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    border-radius: 13px;
    font-size: 13px;
  }
  #fileRow .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #fileRow .fsize { color: var(--muted); flex-shrink: 0; }
  #fileRow .clear {
    color: var(--muted); cursor: pointer; flex-shrink: 0; font-size: 15px; line-height: 1;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(255,255,255,0.06);
  }
  #fileRow .clear:active { background: rgba(255,107,118,0.25); color: var(--err); }

  .section-label {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 650; margin: 22px 2px 10px;
  }

  #progressWrap { display: none; }
  .steps { display: flex; justify-content: space-between; margin-bottom: 14px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 7px; flex: 1; position: relative; }
  .step .dot {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--step-off);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--muted);
    transition: background .3s ease, color .3s ease, box-shadow .3s ease;
    z-index: 1;
    border: 1px solid var(--glass-border);
  }
  .step .label { font-size: 10.5px; color: var(--muted); text-align: center; }
  .step::after {
    content: '';
    position: absolute;
    top: 12px; left: 50%; width: 100%; height: 2px;
    background: var(--step-off);
    z-index: 0;
  }
  .step:last-child::after { display: none; }
  .step.active .dot { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-color: transparent; box-shadow: 0 0 16px -2px var(--accent); }
  .step.done .dot { background: var(--ok); color: #06251a; border-color: transparent; }
  .step.done::after { background: var(--ok); }
  .step.error .dot { background: var(--err); color: white; border-color: transparent; }

  #statusBox {
    padding: 12px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 13px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #statusBox.error { color: var(--err); border-color: rgba(255,107,118,0.3); background: rgba(255,107,118,0.08); }
  #statusBox.success { color: var(--ok); border-color: rgba(52,224,161,0.3); background: rgba(52,224,161,0.08); }
  #statusBox .dot-pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* ---- pinned bottom action bar, like a native app's primary CTA ---- */
  .bottombar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    padding: 14px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: rgba(15,16,24,0.6);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-top: 1px solid var(--glass-border);
  }
  button#buildBtn {
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 650;
    color: white;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    transition: opacity .15s ease, transform .1s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 8px 24px -8px rgba(124,147,255,0.55);
  }
  button#buildBtn:disabled { opacity: 0.35; box-shadow: none; cursor: default; }
  button#buildBtn:not(:disabled):active { transform: scale(0.97); }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid #ffffff55;
    border-top-color: white;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  a#downloadLink {
    display: none;
    width: 100%;
    padding: 15px 20px;
    border-radius: 16px;
    background: var(--ok);
    color: #06251a;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 8px 24px -8px rgba(52,224,161,0.55);
  }
  a#downloadLink:active { opacity: 0.9; }

  input[type=file] { display: none; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="topbar">
    <div class="logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M3 7l9 5 9-5M12 12v10" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>APK Builder</h1>
    <div class="live"><span class="pip"></span>Live</div>
  </div>

  <div class="content">
    <p class="subtitle">Upload your Android project as a .zip. Every build runs in its own isolated branch, so it's safe to use at the same time as anyone else.</p>

    <div class="panel">
      <div id="dropzone">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 16V4m0 0L7 9m5-5l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="primary">Tap to choose a project .zip</div>
        <div class="secondary">or drag and drop it here</div>
      </div>
      <input type="file" id="fileInput" accept=".zip">

      <div id="fileRow">
        <span class="fname" id="fname"></span>
        <span class="fsize" id="fsize"></span>
        <span class="clear" id="clearFile" title="Remove">✕</span>
      </div>
    </div>

    <div class="section-label" id="progressLabel" style="display:none;">Build progress</div>
    <div class="panel" id="progressWrap">
      <div class="steps" id="steps">
        <div class="step" data-step="pushing"><div class="dot">1</div><div class="label">Push</div></div>
        <div class="step" data-step="queued"><div class="dot">2</div><div class="label">Queue</div></div>
        <div class="step" data-step="building"><div class="dot">3</div><div class="label">Build</div></div>
        <div class="step" data-step="done"><div class="dot">4</div><div class="label">Ready</div></div>
      </div>
      <div id="statusBox"><span class="dot-pulse"></span><span id="statusText">Preparing…</span></div>
    </div>
  </div>

  <div class="bottombar">
    <button id="buildBtn" disabled>
      <span class="spinner" id="spinner"></span>
      <span id="buildBtnLabel">Build APK</span>
    </button>
    <a id="downloadLink" href="#">⬇ Download APK</a>
  </div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileRow = document.getElementById('fileRow');
  const fname = document.getElementById('fname');
  const fsize = document.getElementById('fsize');
  const clearFile = document.getElementById('clearFile');
  const buildBtn = document.getElementById('buildBtn');
  const buildBtnLabel = document.getElementById('buildBtnLabel');
  const spinner = document.getElementById('spinner');
  const progressWrap = document.getElementById('progressWrap');
  const progressLabel = document.getElementById('progressLabel');
  const statusBox = document.getElementById('statusBox');
  const statusText = document.getElementById('statusText');
  const downloadLink = document.getElementById('downloadLink');
  const stepOrder = ['pushing', 'queued', 'building', 'done'];

  let selectedFile = null;

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function setFile(file) {
    selectedFile = file;
    if (file) {
      fname.textContent = file.name;
      fsize.textContent = formatSize(file.size);
      fileRow.style.display = 'flex';
      dropzone.classList.add('has-file');
      buildBtn.disabled = false;
    } else {
      fileRow.style.display = 'none';
      dropzone.classList.remove('has-file');
      buildBtn.disabled = true;
    }
  }

  dropzone.onclick = () => fileInput.click();
  fileInput.onchange = () => setFile(fileInput.files[0] || null);

  clearFile.onclick = (e) => {
    e.stopPropagation();
    fileInput.value = '';
    setFile(null);
  };

  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    if (file && file.name.toLowerCase().endsWith('.zip')) setFile(file);
  });

  function resetSteps() {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active', 'done', 'error'));
  }

  function updateSteps(status) {
    const idx = stepOrder.indexOf(status);
    document.querySelectorAll('.step').forEach((el) => {
      const stepIdx = stepOrder.indexOf(el.dataset.step);
      el.classList.remove('active', 'done', 'error');
      if (status === 'error') {
        if (stepIdx <= Math.max(idx, 0)) el.classList.add(stepIdx < idx ? 'done' : 'error');
      } else if (stepIdx < idx) {
        el.classList.add('done');
      } else if (stepIdx === idx) {
        el.classList.add('active');
      }
    });
  }

  buildBtn.onclick = async () => {
    if (!selectedFile) return;
    buildBtn.disabled = true;
    spinner.style.display = 'inline-block';
    buildBtnLabel.textContent = 'Uploading…';
    downloadLink.style.display = 'none';
    progressWrap.style.display = 'block';
    progressLabel.style.display = 'block';
    statusBox.className = '';
    statusText.textContent = 'Uploading your project…';
    resetSteps();

    const formData = new FormData();
    formData.append('projectZip', selectedFile);

    let jobId, error;
    try {
      const res = await fetch('/api/build', { method: 'POST', body: formData });
      ({ jobId, error } = await res.json());
    } catch (e) {
      error = 'Could not reach the server';
    }

    if (error) {
      showError(error);
      return;
    }
    spinner.style.display = 'none';
    buildBtnLabel.textContent = 'Building…';
    poll(jobId);
  };

  function showError(message) {
    statusBox.className = 'error';
    statusText.textContent = message;
    updateSteps('error');
    spinner.style.display = 'none';
    buildBtn.disabled = false;
    buildBtnLabel.textContent = 'Build APK';
  }

  async function poll(jobId) {
    let job;
    try {
      const res = await fetch('/api/status/' + jobId);
      job = await res.json();
    } catch (e) {
      setTimeout(() => poll(jobId), 3000);
      return;
    }

    if (job.status === 'error') {
      showError(job.message || 'Build failed');
      return;
    }

    updateSteps(job.status);
    statusText.textContent = job.message || job.status;

    if (job.status === 'done') {
      statusBox.className = 'success';
      downloadLink.href = '/api/download/' + jobId;
      downloadLink.style.display = 'flex';
      buildBtn.style.display = 'none';
      return;
    }

    setTimeout(() => poll(jobId), 3000);
  }
</script>
</body>
</html>
